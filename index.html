<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Email Templates &mdash; Preview</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f4f5;
    --panel: #ffffff;
    --border: #e4e4e7;
    --control-border: #6b6b70;
    --text: #1a1a1a;
    --muted: #57575c;
    --accent: #1e40af;
    --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111;
      --panel: #1c1c1e;
      --border: #333336;
      --control-border: #8a8a90;
      --text: #ededed;
      --muted: #a1a1a6;
      --accent: #2b5cea;
      --accent-text: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 16px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 12px 24px;
    align-items: center;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 700; }
  h1 span { color: var(--muted); font-weight: 400; }
  .group { display: flex; align-items: center; gap: 6px; }
  .group > label, .group > span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  select, button {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--control-border);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
  }
  button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { padding: 24px 20px 48px; }
  .stage { margin: 0 auto; transition: max-width .15s ease; }
  /* 100000px stands in for 'none' so the transition can interpolate */
  iframe {
    display: block;
    width: 100%;
    height: 78vh;
    min-height: 520px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #ffffff;
  }
  .note {
    max-width: 760px;
    margin: 0 auto 20px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--muted);
    font-size: 13px;
  }
  .note strong { color: var(--text); }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
  }
  a { color: var(--accent); }
</style>
</head>

  var sampleBtn = document.getElementById('sample');
  var note = document.getElementById('note');

  var THEME_NOTE = ' This iframe follows your OS light/dark setting, so it shows the palette ' +
    'that Apple Mail, Outlook and Fastmail render. It cannot show what Gmail or Yahoo do, ' +
    'because they force their own inversion instead of honouring ' +
    '<code>prefers-color-scheme</code>. <strong>Desktop</strong> is 640px so the email clears ' +
    'its own 600px breakpoint.';

  function selected() {
    return tpl.options[tpl.selectedIndex];
  }

  function hasExample() {
    var o = selected();
    return !!o && o.getAttribute('data-example') === '1';
  }

  function showingSample() {
    return sampleBtn.getAttribute('aria-pressed') === 'true';
  }

  function render() {
    var path = tpl.value;
    if (showingSample() && hasExample()) {
      path = path.replace('templates/', 'examples/');
    }
    frame.src = path;

    if (!hasExample()) {
      note.innerHTML = 'This page is the component reference, not a sendable email. ' +
        'It has no filled-in twin.' + THEME_NOTE;
    } else if (showingSample()) {
      note.innerHTML = 'Showing <code>' + path + '</code> &mdash; the same template with a ' +
        'fictional company filled in. These files are committed; you can open them directly.' +
        THEME_NOTE;
    } else {
      note.innerHTML = 'Showing <code>' + path + '</code> with its <code>[PLACEHOLDER]</code> ' +
        'tokens. Press <strong>Sample data</strong> to see it filled in.' + THEME_NOTE;
    }
  }

  function syncSampleButton() {
    var available = hasExample();
    sampleBtn.disabled = !available;
    sampleBtn.title = available ? '' : 'No filled-in version of this page';
    if (!available) {
      sampleBtn.setAttribute('aria-pressed', 'false');
    }
  }

  function load() {
    syncSampleButton();
    render();
  }

  document.getElementById('widths').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) { return; }
    var buttons = this.querySelectorAll('button');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute('aria-pressed', String(buttons[i] === btn));
    }
    var w = Number(btn.dataset.w);
    stage.style.maxWidth = w ? w + 'px' : '100000px';
  });

  sampleBtn.addEventListener('click', function () {
    if (this.disabled) { return; }
    this.setAttribute('aria-pressed', String(!showingSample()));
    render();
  });

  tpl.addEventListener('change', load);
  load();
